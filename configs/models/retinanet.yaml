name: retinanet
family: torchvision
arch: retinanet_resnet50_fpn_v2
pretrained: true
min_size: 640
max_size: 1024
score_thresh: 0.01
train:
  epochs: 24
  batch_size: 8
  optimizer: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  warmup_iters: 500
  scheduler: cosine
  amp: true
  grad_clip: 10.0
  eval_every: 1
  patience: 6
