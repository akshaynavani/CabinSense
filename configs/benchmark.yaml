# Full five-model benchmark on SVIRO.
experiment: cabinsense-sviro
data: configs/data/sviro.yaml
seats: configs/seats/default.yaml
output_dir: ${CABINSENSE_OUTPUT:-outputs}
device: null              # auto: cuda if available
fail_fast: false
tracking:
  enabled: true
  experiment: cabinsense-sviro
  tracking_uri: ${MLFLOW_TRACKING_URI:-}
  log_checkpoints: true
eval:
  split: test
  batch_size: 8
  score_thresh: 0.001
  latency_runs: 50
models:
  - configs/models/faster_rcnn.yaml
  - configs/models/retinanet.yaml
  - configs/models/efficientdet.yaml
  - configs/models/yolov8.yaml
  - configs/models/yolox.yaml
sagemaker:
  instance_type: ml.g5.2xlarge   # 1x A10G 24 GB
  instance_count: 1
  framework_version: "2.2"
  py_version: py310
  volume_size: 100
  max_run_hours: 24
  use_spot: true
  max_wait_hours: 36
